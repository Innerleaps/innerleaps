      name="keywords"
      content="vitaliteitsprogramma, eigenaarschap medewerkers, veerkracht training, productiviteit verhogen, burn-out preventie, werknemers vitaal, stress verminderen, prestatieverbetering"

    <!-- Geen preload voor de hero meer. Die wees naar /src/assets/..., een pad

<!DOCTYPE html>
<html lang="nl">
  <head>
    <!--
      Consent Mode v2, als allereerste script en synchroon.

      Volgorde is hier het hele punt: laadt gtag.js eerder dan dit blok, dan
      vuurt de tag één keer zonder toestemming en is de opzet waardeloos. Dus
      geen async, geen defer, en niet onderaan de body.

      wait_for_update geeft de cookiebanner een halve seconde om de keuze door
      te geven voordat de tag zijn eerste ping stuurt. Zonder die regel telt een
      bezoeker die daarna accepteert alsnog niet mee.

      url_passthrough geeft de gclid via de URL door als cookies geweigerd zijn.
      Bij lage advertentievolumes is dat een van de weinige gratis manieren om
      meetverlies te beperken.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'analytics_storage': 'denied',
        'functionality_storage': 'granted',
        'security_storage': 'granted',
        'wait_for_update': 500
      });
      gtag('set', 'ads_data_redaction', true);
      gtag('set', 'url_passthrough', true);
    </script>

    <!--
      De Google tag. Eén bestand bedient GA4 en Google Ads, dus er komt geen
      tweede script voor Ads bij.

      Tijdens het prerenderen wordt dit verzoek geblokkeerd, zie
      scripts/prerender.mjs. Anders stuurt de bouwmachine bij elke deploy 32
      nepbezoeken naar GA4.
    -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RGNWZTYB0H"></script>
    <script>
      gtag('js', new Date());
      gtag('config', 'G-RGNWZTYB0H');
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Innerleaps verlaagt verzuim en voorkomt burn-out door vitaliteitstraining</title>
    <!-- data-rh markeert deze tags als "beheerd door react-helmet-async":
         PageSeo vervangt ze per pagina zodra de app laadt, zodat er geen
         dubbele description/og-tags in de head blijven staan. -->
    <meta
      data-rh="true"
      name="description"
      content="Innerleaps verlaagt ziekteverzuim met 15-21% via wetenschappelijk onderbouwde breintraining. 6 weken, 12 minuten per dag. Gebaseerd op 40 jaar onderzoek."
    />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <meta
      name="keywords"
      content="vitaliteitsprogramma, eigenaarschap medewerkers, veerkracht training, productiviteit verhogen, burn-out preventie, werknemers vitaal, stress verminderen, prestatieverbetering"
    />
    <meta name="author" content="Innerleaps" />

    <meta data-rh="true" property="og:title" content="Innerleaps verlaagt verzuim en voorkomt burn-out door vitaliteitstraining" />
    <meta
      data-rh="true"
      property="og:description"
      content="Een wetenschappelijk onderbouwd vitaliteitprogramma waarin deelnemers hun brein trainen. Ze ontwikkelen een sterkere focus, kunnen stress sneller herkennen en leren technieken om dit te reguleren."
    />
    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:url" content="https://innerleaps.nl" />
    <meta data-rh="true" property="og:image" content="https://innerleaps.nl/og-image.png" />
    <meta data-rh="true" property="og:image:width" content="1200" />
    <meta data-rh="true" property="og:image:height" content="630" />

    <meta data-rh="true" name="twitter:card" content="summary_large_image" />
    <meta data-rh="true" name="twitter:site" content="@innerleaps" />
    <meta data-rh="true" name="twitter:title" content="Innerleaps verlaagt verzuim en voorkomt burn-out door vitaliteitstraining" />
    <meta data-rh="true" name="twitter:description" content="Een wetenschappelijk onderbouwd vitaliteitprogramma waarin deelnemers hun brein trainen. Ze ontwikkelen een sterkere focus, kunnen stress sneller herkennen en leren technieken om dit te reguleren." />
    <meta data-rh="true" name="twitter:image" content="https://innerleaps.nl/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

    <!-- De boekingswidget hangt aan calendly.com en trekt zijn eigen bestanden
         van assets.calendly.com. Door de verbinding alvast op te zetten staat
         DNS, TLS en de handshake al klaar op het moment dat het iframe begint
         te laden. Dat scheelt de bezoeker een paar honderd milliseconde voordat
         hij ook maar een dag kan aanklikken. -->
    <link rel="preconnect" href="https://calendly.com" crossorigin />
    <link rel="preconnect" href="https://assets.calendly.com" crossorigin />
    <link rel="dns-prefetch" href="https://calendly.com" />

    <!-- Preload critical fonts for faster rendering -->
    <!-- Hier stond een preload van een Figtree-bestand met een vaste URL op
         versie 5. Google versienummert die bestanden, staat inmiddels op v9, en
         die oude URL gaf een 404 bij elke paginalading. Een vaste URL naar een
         Google-lettertypebestand veroudert dus vanzelf. De preconnect hierboven
         en de stylesheet hieronder doen het werk. -->
    
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&family=Asap+Condensed:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    
    <!-- Geen preload voor de hero meer. Die wees naar /src/assets/..., een pad
         dat alleen tijdens ontwikkelen bestaat: in productie krijgt het bestand
         een hash in de naam. Elke bezoeker deed dus een mislukte aanvraag zonder
         dat er iets werd voorgeladen. De hero laadt zelf al met loading="eager". -->

    <!-- Organization-schema, sitewide. Staat hier statisch zodat het prerenderen
         hem meeneemt naar alle 24 pagina's. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://innerleaps.nl/#organization",
        "name": "Innerleaps",
        "url": "https://innerleaps.nl/",
        "logo": {
          "@type": "ImageObject",
          "url": "https://innerleaps.nl/lovable-uploads/06d0112b-b23b-4ce0-b028-68ac939b2b2b.webp"
        },
        "sameAs": ["https://www.linkedin.com/company/innerleaps/"],
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "NL"
        }
      }
    </script>

    <!-- Apollo.io Website Tracker for cold email campaign tracking -->
    <script>function initApollo(){var n=Math.random().toString(36).substring(7),o=document.createElement("script");o.src="https://assets.apollo.io/micro/website-tracker/tracker.iife.js?nocache="+n,o.async=!0,o.defer=!0,o.onload=function(){window.trackingFunctions.onLoad({appId:"691354c3d2251c00215e6dae"})},document.head.appendChild(o)}initApollo();</script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

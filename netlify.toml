[[redirects]]
  from = "/signup"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/9-stippen"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/algemene-voorwaarden"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/privacy"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/cookies"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/masterclass-stress-qr"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/bedankt"
  to = "/index.html"
  status = 200
[[redirects]]

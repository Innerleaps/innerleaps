# Netlify-configuratie voor innerleaps.nl
# Zie MIGRATIE-PLAN.md voor de context.

[build]
  # Chrome expliciet ophalen voordat we bouwen. Het prerenderen heeft hem
  # nodig. Normaal haalt puppeteer hem binnen via een install-script, maar
  # er staan drie lockfiles in deze repo en Netlify kiest bun zodra hij
  # bun.lockb ziet. Bun draait die install-scripts standaard niet, en dan
  # ontbreekt Chrome. Zo werkt het ongeacht welke pakketbeheerder hij kiest.
  command = "npx --yes puppeteer browsers install chrome && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Puppeteer haalt zijn eigen Chrome binnen. Standaard komt die in de
  # thuismap, en die bewaart Netlify niet tussen builds. Hierdoor komt hij
  # in de repo-map te staan, die wel gecachet wordt. Scheelt elke build
  # een download van ruim 100 MB.
  PUPPETEER_CACHE_DIR = "/opt/build/repo/.cache/puppeteer"

# Hernoemde pagina's, stap 5 uit MIGRATIE-PLAN.md. Echte 301's, zodat Google
# de opgebouwde waarde meeneemt naar de nieuwe URL. Deze staan bewust boven de
# catch-all hieronder, want die vangt anders alles af.
#
# Geen `force` nodig: na het hernoemen prerendert de build de oude paden niet
# meer, dus er ligt geen bestand dat de redirect zou overrulen.
[[redirects]]
  from = "/vitaliteitstraining"
  to = "/duurzame-inzetbaarheid"
  status = 301

# De teampagina is drie keer hernoemd. Alle oude paden wijzen daarom direct naar
# het huidige pad, nooit naar een tussenstation. Zou
# `/duurzame-inzetbaarheid-training` naar `/inzetbaarheid-verbeteren` blijven
# wijzen, dan kreeg je een 301 op een 301 op een 301. Dat kost elke bezoeker
# extra omleidingen en laat waarde weglekken.
#
# De laatste hernoeming was om kannibalisatie te voorkomen: de vorige naam
# begon met `duurzame-inzetbaarheid` en concurreerde daarmee met de pagina die
# op die term moet ranken.
[[redirects]]
  from = "/duurzame-inzetbaarheid-training"
  to = "/team-prestaties-verbeteren"
  status = 301

[[redirects]]
  from = "/inzetbaarheid-verbeteren"
  to = "/team-prestaties-verbeteren"
  status = 301

[[redirects]]
  from = "/duurzame-inzetbaarheid-teams"
  to = "/team-prestaties-verbeteren"
  status = 301

[[redirects]]
  from = "/en/vitality-training"
  to = "/en/sustainable-employability"
  status = 301

[[redirects]]
  from = "/en/sustainable-employability-training"
  to = "/en/improve-team-performance"
  status = 301

[[redirects]]
  from = "/en/improve-employability"
  to = "/en/improve-team-performance"
  status = 301

[[redirects]]
  from = "/en/sustainable-employability-teams"
  to = "/en/improve-team-performance"
  status = 301

# De 24 pagina's uit ROUTE_MAP worden geprerenderd naar platte .html-bestanden.
# Die serveert Netlify vanzelf, daar is geen regel voor nodig.
#
# Deze veertien routes bestaan wél in de router maar worden niet geprerenderd.
# Zonder een expliciete regel zouden ze onder de 404 hieronder vallen. Voeg een
# route toe aan App.tsx zonder hem in ROUTE_MAP te zetten? Dan hoort hij hier ook
# bij, anders is hij vanaf de volgende deploy onbereikbaar.
[[redirects]]
  from = "/de-methode"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/leven-vragenlijst"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/leven-vragenlijst/resultaat"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/life-questionnaire"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/life-questionnaire/result"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/calendar"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/signup"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/9-stippen"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/algemene-voorwaarden"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/privacy"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/cookies"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/masterclass-stress-qr"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/bedankt"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/masterclass-bedankt"
  to = "/index.html"
  status = 200

# Alles wat hierboven niet is opgevangen bestaat echt niet. Vroeger ging dit naar
# /index.html met status 200, waardoor elke typefout een "zachte 404" opleverde:
# de homepage met een 200-status. Google ziet dat als een kwaliteitsprobleem en
# verspilt er crawlbudget aan. Nu een echte 404.
# Deze regel hoort altijd als laatste.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Gehashte bestanden mogen lang gecachet worden, de naam verandert toch
# bij elke build.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

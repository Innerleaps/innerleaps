# Netlify-configuratie voor innerleaps.nl
# Zie MIGRATIE-PLAN.md voor de context.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# De site is een single page app. Zonder deze regel geeft elke directe link
# naar een subpagina een 404, bijvoorbeeld innerleaps.nl/vitaliteitstraining.
# Status 200 en niet 301, want de URL moet blijven staan zoals hij is.
# Deze regel hoort altijd als laatste, anders vangt hij echte redirects af.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Gehashte bestanden mogen lang gecachet worden, de naam verandert toch
# bij elke build.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
